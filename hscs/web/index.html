<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HKHS Code Search</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%234285f4'/%3E%3Ctext x='16' y='21' font-family='Arial' font-size='14' font-weight='bold' fill='white' text-anchor='middle'%3EHS%3C/text%3E%3C/svg%3E" />
  </head>
  <body class="home">
    <header class="header">
      <a class="logo" href="./" aria-label="HKHS Code Search home">HKHS Code Search</a>
      <form id="search" role="search" autocomplete="off">
        <div class="box">
          <svg class="icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 1 0-.7.7l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
          <input id="q" name="q" type="search" aria-label="Commodity description" />
          <button type="button" class="clear" id="clear" aria-label="Clear" hidden>
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4l5.6 5.6L5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6z"/></svg>
          </button>
          <select id="level" name="level" aria-label="Result level">
            <option value="chapter">Chapter</option>
            <option value="heading">Heading</option>
            <option value="subheading" selected>Subheading</option>
            <option value="hkhs">HKHS</option>
          </select>
          <button type="submit" class="go">Search</button>
        </div>
      </form>
    </header>
    <main id="results" aria-live="polite"></main>
    <footer class="footer">
      <p class="disclaimer">Unofficial (not affiliated with any government agency) · Search results may be inaccurate: verify with official sources</p>
      <div class="links">
        <a href="https://www.customs.gov.hk/en/service-enforcement-information/cargo-clearance/import-export-declaration/index.html" target="_blank" rel="noopener">Hong Kong Harmonised System, 2026 edition</a>
        <a class="right" href="https://github.com/Jack-cky/HKHS-Code-Search" target="_blank" rel="noopener">GitHub</a>
      </div>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
