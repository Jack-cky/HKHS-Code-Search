[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hscs"
version = "1.0.1"
description = "HKHS Code Search API"
license = { text = "MIT" }
authors = [{ name = "Jack Chan" }]
requires-python = "~=3.12.0"
dependencies = [
    "faiss-cpu==1.15.0",
    "fastapi==0.141.1",
    "nltk==3.10.3",
    "numpy==2.5.3",
    "pandas==3.0.5",
    "pyarrow==25.0.1",
    "python-dotenv==1.2.3",
    "rank-bm25==0.2.2",
    "sentence-transformers[onnx]==5.7.0",
    "torch==2.14.0",
    "uvicorn==0.52.4",
]

[tool.setuptools.packages.find]
include = ["hscs*"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.vercel]
entrypoint = "hscs.api.main:app"
