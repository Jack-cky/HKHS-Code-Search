[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hscs"
version = "1.0.3"
description = "HKHS Code Search API"
license = { text = "MIT" }
authors = [{ name = "Jack Chan" }]
requires-python = "~=3.12.0"
dependencies = [
    "faiss-cpu==1.15.0",
    "fastapi==0.141.1",
    "huggingface-hub==1.32.0",
    "nltk==3.10.3",
    "numpy==2.5.3",
    "onnxruntime==1.30.0",
    "python-dotenv==1.2.3",
    "rank-bm25==0.2.2",
    "tokenizers==0.23.2",
    "uvicorn==0.52.4",
]

[tool.setuptools.packages.find]
include = ["hscs*"]

[tool.vercel]
entrypoint = "hscs.api.main:app"
